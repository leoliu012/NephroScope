<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101317" />
    <meta name="description" content="NephroScope — review and measurement workspace for renal microscopy images." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101317'/%3E%3Cg fill='none' stroke='%2363a4d8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 6h4v5h-4z'/%3E%3Cpath d='M12 11h8l-1 7h-6z'/%3E%3Cpath d='M11 22h10'/%3E%3Cpath d='M13 22v3h6v-3'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>NephroScope — Renal Microscopy Review</title>
    <style>
      html, body { margin: 0; background: #101317; color: #a5afb9; }
      .boot-screen { display: flex; height: 100vh; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .boot-screen p { max-width: 460px; margin: 0; }
      .boot-screen button { border: 1px solid #3a4551; border-radius: 6px; background: #20262d; color: #e8edf2; padding: 7px 16px; font: inherit; cursor: pointer; }
      .boot-screen button[hidden] { display: none; }
    </style>
    <script>
      // Boot guard: if any of the app's files fails to load, the page would
      // otherwise stay blank. Retry a few times, then explain and offer reload.
      (function () {
        var KEY = 'nephroscope:boot-attempts'
        var MAX_RETRIES = 3
        var done = false
        function attempts() { try { return Number(sessionStorage.getItem(KEY)) || 0 } catch (e) { return MAX_RETRIES } }
        function setAttempts(value) { try { sessionStorage.setItem(KEY, String(value)) } catch (e) { /* optional */ } }
        function show(message, canReload) {
          var text = document.querySelector('[data-boot-message]')
          var button = document.querySelector('[data-boot-reload]')
          if (text) text.textContent = message
          if (button) button.hidden = !canReload
        }
        function fail(reason) {
          if (done) return
          done = true
          var count = attempts()
          if (count < MAX_RETRIES) {
            setAttempts(count + 1)
            show('Some files did not load (' + reason + '). Retrying… (' + (count + 1) + '/' + MAX_RETRIES + ')', false)
            setTimeout(function () { window.location.reload() }, 700 * (count + 1))
          } else {
            setAttempts(0)
            show('NephroScope could not load all of its files because the connection to the server dropped some requests. Reload to try again.', true)
          }
        }
        window.__nephroscopeBoot = { ready: function () { done = true; setAttempts(0) } }
        window.addEventListener('error', function (event) {
          var target = event.target
          if (target && (target.tagName === 'SCRIPT' || (target.tagName === 'LINK' && target.rel === 'stylesheet'))) fail('network error')
        }, true)
        setTimeout(function () { if (!done) fail('timed out') }, 45000)
        if ('serviceWorker' in navigator && window.isSecureContext) {
          navigator.serviceWorker.register('%BASE_URL%sw.js', { scope: '%BASE_URL%' }).catch(function () { /* optional */ })
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status">
        <p data-boot-message>Loading NephroScope…</p>
        <button type="button" data-boot-reload hidden onclick="window.location.reload()">Reload</button>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
