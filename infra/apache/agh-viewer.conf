# AGH Image Viewer
Alias /agh /var/www/html/agh

<Directory /var/www/html/agh>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /agh/index.html

    # Baseline hardening for the SPA shell and assets.
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "DENY"
    Header set Referrer-Policy "no-referrer"

    <FilesMatch "\.(?:js|css|png|svg|ico|woff2?)$">
        Header set Cache-Control "private, max-age=31536000, immutable"
    </FilesMatch>
    # index.html must never be cached, so clients always fetch the current build.
    <FilesMatch "^index\.html$">
        Header set Cache-Control "no-store"
    </FilesMatch>
</Directory>

# Authentication and authorization are enforced by the Flask API itself
# (per-user accounts, session cookies, CSRF). Apache must therefore grant
# access at this layer and must NOT add "AuthType Basic", or browsers would
# show their native credential popup ahead of the app's own login screen.
<Location "/agh/api">
    Require all granted
</Location>

# Tell the backend the original request scheme so it can mark session cookies
# "Secure" when the client connection is HTTPS. mod_proxy_http already appends
# the real client address to X-Forwarded-For, which the backend uses for
# login rate-limiting.
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

ProxyPass /agh/api/ http://127.0.0.1:5055/agh/api/ nocanon
ProxyPassReverse /agh/api/ http://127.0.0.1:5055/agh/api/
ProxyPass /agh !
ProxyPass /agh/ !
